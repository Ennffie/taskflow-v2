<svg width="1200" height="1500" viewBox="0 0 1200 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="600" y1="0" x2="600" y2="1500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF8FF"/>
      <stop offset="1" stop-color="#F2F8FF"/>
    </linearGradient>
    <linearGradient id="phoneBg" x1="390" y1="0" x2="390" y2="844" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCF9FF"/>
      <stop offset="1" stop-color="#F5F8FF"/>
    </linearGradient>
    <radialGradient id="planet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(330 250) rotate(56) scale(360)">
      <stop stop-color="#EEDFFF"/>
      <stop offset="0.48" stop-color="#D7C2FB"/>
      <stop offset="1" stop-color="#C1A9F7"/>
    </radialGradient>
    <linearGradient id="orbit" x1="120" y1="80" x2="670" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFE7FF"/>
      <stop offset="1" stop-color="#DDD3FF"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="1500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#8B5CF6" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>

  <g transform="translate(210 120)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="780" height="1260" rx="72" fill="url(#phoneBg)"/>
    </g>
    <rect x="246" y="18" width="288" height="36" rx="18" fill="#0F172A" fill-opacity="0.92"/>

    <text x="52" y="120" fill="#0F172A" font-size="42" font-family="Arial, sans-serif" font-weight="800">今日想先搞邊樣？</text>
    <text x="52" y="162" fill="#6B7280" font-size="20" font-family="Arial, sans-serif">先睇最浮面嘅 main task，再慢慢跟落去</text>

    <rect x="34" y="206" width="712" height="620" rx="42" fill="#FFFFFF" fill-opacity="0.86"/>

    <g transform="translate(390 462)">
      <ellipse cx="0" cy="0" rx="222" ry="146" stroke="url(#orbit)" stroke-width="8" stroke-dasharray="8 14"/>
      <ellipse cx="0" cy="0" rx="162" ry="220" stroke="url(#orbit)" stroke-width="6" stroke-dasharray="7 12" opacity="0.92"/>

      <circle cx="0" cy="0" r="156" fill="url(#planet)"/>
      <circle cx="-48" cy="-62" r="46" fill="#FFFFFF" fill-opacity="0.18"/>
      <circle cx="40" cy="82" r="20" fill="#FFFFFF" fill-opacity="0.10"/>

      <text x="0" y="-2" text-anchor="middle" fill="#5A21B6" font-size="42" font-family="Arial, sans-serif" font-weight="800">UX Review</text>
      <text x="0" y="40" text-anchor="middle" fill="#6D28D9" font-size="20" font-family="Arial, sans-serif" font-weight="700">main task</text>
      <text x="0" y="74" text-anchor="middle" fill="#6B7280" font-size="16" font-family="Arial, sans-serif">5 subtasks orbiting around</text>

      <g transform="translate(0 -156)">
        <circle cx="0" cy="0" r="26" fill="#8B5CF6"/>
        <circle cx="-7" cy="-8" r="6" fill="#F5EFFF" fill-opacity="0.72"/>
        <circle cx="7" cy="8" r="10" fill="#D8C1FF" fill-opacity="0.55"/>
      </g>
      <g transform="translate(188 0)">
        <circle cx="0" cy="0" r="22" fill="#A78BFA"/>
        <circle cx="-6" cy="-6" r="5" fill="#F5EFFF" fill-opacity="0.68"/>
        <circle cx="0" cy="0" r="11" fill="#C9A9FF" fill-opacity="0.34"/>
      </g>
      <g transform="translate(0 160)">
        <circle cx="0" cy="0" r="18" fill="#DDD6FE"/>
        <circle cx="0" cy="0" r="8" fill="#7D3AED" fill-opacity="0.56"/>
      </g>
      <g transform="translate(-188 0)">
        <circle cx="0" cy="0" r="24" fill="#E6D6FF"/>
        <circle cx="-6" cy="-6" r="6" fill="#FFF" fill-opacity="0.60"/>
        <circle cx="0" cy="0" r="14" fill="#7D3AED" fill-opacity="0.14"/>
      </g>
      <g transform="translate(112 146)">
        <circle cx="0" cy="0" r="16" fill="#F0ABFC"/>
        <circle cx="-5" cy="-5" r="4" fill="#FFF" fill-opacity="0.60"/>
        <circle cx="0" cy="0" r="12" fill="#7D3AED" fill-opacity="0.92"/>
      </g>
    </g>

    <g>
      <rect x="72" y="778" width="156" height="52" rx="26" fill="#111827"/>
      <text x="150" y="810" text-anchor="middle" fill="#FFFFFF" font-size="18" font-family="Arial, sans-serif" font-weight="700">一步步加</text>
      <rect x="242" y="778" width="124" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.9"/>
      <text x="304" y="810" text-anchor="middle" fill="#4B5563" font-size="18" font-family="Arial, sans-serif" font-weight="700">直接打</text>
      <rect x="380" y="778" width="152" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.9"/>
      <text x="456" y="810" text-anchor="middle" fill="#4B5563" font-size="18" font-family="Arial, sans-serif" font-weight="700">貼內容入嚟</text>
    </g>

    <rect x="34" y="868" width="332" height="304" rx="34" fill="#FFFFFF" fill-opacity="0.88"/>
    <rect x="414" y="868" width="332" height="304" rx="34" fill="#FFFFFF" fill-opacity="0.88"/>

    <text x="62" y="926" fill="#0F172A" font-size="28" font-family="Arial, sans-serif" font-weight="800">今日要搞</text>
    <rect x="62" y="956" width="276" height="86" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="88" y="1006" fill="#0F172A" font-size="20" font-family="Arial, sans-serif" font-weight="700">跟進 onboarding page</text>
    <text x="88" y="1034" fill="#6B7280" font-size="14" font-family="Arial, sans-serif">交俾：Alice · 今日 5:30 PM</text>
    <rect x="62" y="1058" width="276" height="86" rx="24" fill="#FFF8ED" stroke="#FDE2B8"/>
    <text x="88" y="1108" fill="#0F172A" font-size="20" font-family="Arial, sans-serif" font-weight="700">Benne UX review deck</text>
    <text x="88" y="1136" fill="#6B7280" font-size="14" font-family="Arial, sans-serif">交俾：我自己 · 今日 3:30 PM</text>

    <text x="442" y="926" fill="#0F172A" font-size="28" font-family="Arial, sans-serif" font-weight="800">唔好漏咗</text>
    <rect x="442" y="964" width="276" height="56" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="466" y="998" fill="#0F172A" font-size="18" font-family="Arial, sans-serif" font-weight="700">未設定 deadline</text>
    <rect x="442" y="1036" width="276" height="56" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="466" y="1070" fill="#0F172A" font-size="18" font-family="Arial, sans-serif" font-weight="700">等緊人覆</text>
    <rect x="442" y="1108" width="276" height="56" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="466" y="1142" fill="#0F172A" font-size="18" font-family="Arial, sans-serif" font-weight="700">未確認 assignee</text>
  </g>
</svg>
