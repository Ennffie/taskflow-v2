<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="600" y1="0" x2="600" y2="1200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F2FF"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <linearGradient id="bubbleMain" x1="600" y1="330" x2="600" y2="870" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="1200" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#6D28D9" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="76" y="72" width="1048" height="1056" rx="40" fill="#FFFFFF" fill-opacity="0.88"/>
  </g>

  <text x="120" y="150" fill="#6D28D9" font-size="24" font-family="Arial, sans-serif" font-weight="700">Mixed subtask stages demo</text>
  <text x="120" y="208" fill="#0F172A" font-size="48" font-family="Arial, sans-serif" font-weight="800">一個 bubble，可同時有唔同 subtask stage</text>
  <text x="120" y="254" fill="#64748B" font-size="24" font-family="Arial, sans-serif">每個 segment 代表一個 subtask，各自用顏色表達自己的 stage</text>

  <!-- ring segments -->
  <g transform="translate(600 600)">
    <!-- 8 segments total -->
    <path d="M 0 -330 A 330 330 0 0 1 206.0 -257.6" stroke="#D8DCE8" stroke-width="28" stroke-linecap="round"/>
    <path d="M 233.3 -233.3 A 330 330 0 0 1 330 0" stroke="#60A5FA" stroke-width="28" stroke-linecap="round"/>
    <path d="M 311.0 95.0 A 330 330 0 0 1 233.3 233.3" stroke="#60A5FA" stroke-width="28" stroke-linecap="round"/>
    <path d="M 206.0 257.6 A 330 330 0 0 1 0 330" stroke="#F59E0B" stroke-width="28" stroke-linecap="round"/>
    <path d="M -95.0 311.0 A 330 330 0 0 1 -257.6 206.0" stroke="#F59E0B" stroke-width="28" stroke-linecap="round"/>
    <path d="M -233.3 233.3 A 330 330 0 0 1 -330 0" stroke="#8B5CF6" stroke-width="28" stroke-linecap="round"/>
    <path d="M -311.0 -95.0 A 330 330 0 0 1 -233.3 -233.3" stroke="#8B5CF6" stroke-width="28" stroke-linecap="round"/>
    <path d="M -206.0 -257.6 A 330 330 0 0 1 0 -330" stroke="#D8DCE8" stroke-width="28" stroke-linecap="round"/>

    <!-- glow hint on in-progress blue -->
    <path d="M 233.3 -233.3 A 330 330 0 0 1 330 0" stroke="#93C5FD" stroke-width="42" stroke-linecap="round" opacity="0.28"/>

    <!-- main bubble -->
    <circle cx="0" cy="0" r="235" fill="url(#bubbleMain)"/>
    <circle cx="-58" cy="-72" r="72" fill="#FFFFFF" fill-opacity="0.22"/>

    <text x="0" y="-8" text-anchor="middle" fill="#4338CA" font-size="44" font-family="Arial, sans-serif" font-weight="800">UX Review</text>
    <text x="0" y="44" text-anchor="middle" fill="#5B21B6" font-size="22" font-family="Arial, sans-serif" font-weight="700">8 subtasks</text>
    <text x="0" y="80" text-anchor="middle" fill="#64748B" font-size="18" font-family="Arial, sans-serif">2 未開始 · 2 做緊 · 2 等緊 · 2 完成</text>
  </g>

  <!-- legend -->
  <g transform="translate(150 940)">
    <circle cx="16" cy="16" r="16" fill="#D8DCE8"/>
    <text x="48" y="24" fill="#475569" font-size="24" font-family="Arial, sans-serif" font-weight="700">未開始</text>

    <circle cx="296" cy="16" r="16" fill="#60A5FA"/>
    <text x="328" y="24" fill="#475569" font-size="24" font-family="Arial, sans-serif" font-weight="700">做緊</text>

    <circle cx="536" cy="16" r="16" fill="#F59E0B"/>
    <text x="568" y="24" fill="#475569" font-size="24" font-family="Arial, sans-serif" font-weight="700">等緊</text>

    <circle cx="776" cy="16" r="16" fill="#8B5CF6"/>
    <text x="808" y="24" fill="#475569" font-size="24" font-family="Arial, sans-serif" font-weight="700">完成</text>
  </g>

  <text x="150" y="1040" fill="#0F172A" font-size="28" font-family="Arial, sans-serif" font-weight="800">我建議嘅讀法</text>
  <text x="150" y="1088" fill="#475569" font-size="22" font-family="Arial, sans-serif">• segment 數量 = subtask 數量</text>
  <text x="150" y="1124" fill="#475569" font-size="22" font-family="Arial, sans-serif">• 每格用自己顏色表示個別 subtask stage</text>
  <text x="150" y="1160" fill="#475569" font-size="22" font-family="Arial, sans-serif">• 當 subtask 太多時，再轉 summary mode</text>
</svg>
