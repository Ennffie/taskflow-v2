<svg width="1200" height="1500" viewBox="0 0 1200 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="600" y1="0" x2="600" y2="1500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF8FF"/>
      <stop offset="1" stop-color="#F1F8FF"/>
    </linearGradient>
    <linearGradient id="phoneBg" x1="390" y1="0" x2="390" y2="844" gradientUnits="userSpaceOnUse">
