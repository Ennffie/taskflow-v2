<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="600" y1="0" x2="600" y2="1200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F2FF"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <linearGradient id="bubble" x1="600" y1="330" x2="600" y2="870" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="600" cy="600" r="250" fill="url(#bubble)"/>
  <circle cx="540" cy="510" r="78" fill="white" fill-opacity="0.22"/>

  <!-- base arc -->
  <path d="M 600 285 A 315 315 0 1 1 377 377" stroke="#D9D6FE" stroke-width="24" stroke-linecap="round" opacity="0.9"/>
  <!-- progress arc ~68% -->
  <path d="M 600 285 A 315 315 0 1 1 302 702" stroke="#7C3AED" stroke-width="24" stroke-linecap="round"/>

  <text x="600" y="585" text-anchor="middle" fill="#4338CA" font-size="56" font-family="Arial, sans-serif" font-weight="800">UX Review</text>
  <text x="600" y="645" text-anchor="middle" fill="#5B21B6" font-size="28" font-family="Arial, sans-serif" font-weight="700">整體 progress</text>

  <text x="600" y="890" text-anchor="middle" fill="#475569" font-size="28" font-family="Arial, sans-serif">外圍只得一條線：淡色係 full，實色長度係完成度</text>
</svg>
