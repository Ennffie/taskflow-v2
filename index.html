
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>TaskFlow v2</title>
    <script>
      // Aggressive cache bust: force reload if this is an old version
      (function() {
        const VERSION = '2026-06-09-proxy-leave-picker-v2';
        try {
          const stored = localStorage.getItem('tf2_version');
          if (stored !== VERSION) {
            localStorage.setItem('tf2_version', VERSION);
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) { caches.delete(name); });
              });
            }
            // Force reload from server, not cache
            window.location.href = window.location.href.split('?')[0] + '?v=' + Date.now();
          }
        } catch(e) {}
      })();
    </script>
    <style>
      body { margin: 0; font-family: -apple-system, system-ui; }
      #fallback { padding: 40px 20px; background: #fef2f2; min-height: 100vh; display: none; }
    </style>
    <!-- Build: auto -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
