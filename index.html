<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./taskflow-app-icon.png?v=6" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=6" />
    <link rel="manifest" href="./manifest.webmanifest?v=6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f0f9ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TaskFlow" />
    <title>TaskFlow v2</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="build" content="2026-05-03-1440" />
    <script>
      // Aggressive cache bust - force reload if old version detected
      (function() {
        var expectedBuild = '2026-05-03-1440';
        var storedBuild = localStorage.getItem('taskflow_build');
        if (storedBuild && storedBuild !== expectedBuild) {
          console.log('Cache bust: old build detected, forcing reload');
          localStorage.setItem('taskflow_build', expectedBuild);
          window.location.reload(true);
        } else {
          localStorage.setItem('taskflow_build', expectedBuild);
        }
        window.__TASKFLOW_BUILD__ = expectedBuild;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx?v=5"></script>
  </body>
</html>
