<svg width="1080" height="1800" viewBox="0 0 1080 1800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="540" y1="0" x2="540" y2="1800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F2FF"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <linearGradient id="bubble1" x1="0" y1="-88" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="bubble2" x1="0" y1="-88" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="bubble3" x1="0" y1="-88" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEF3C7"/>
      <stop offset="1" y="1" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="bubble4" x1="0" y1="-88" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1800" fill="url(#bg)"/>
  <rect x="48" y="48" width="984" height="1704" rx="36" fill="rgba(255,255,255,0.88)"/>
  <rect x="48" y="48" width="984" height="1704" rx="36" fill="#fff" fill-opacity="0.84"/>

  <text x="88" y="120" fill="#6D28D9" font-size="26" font-family="Arial, sans-serif" font-weight="700">Task segment arc · 4-stage 試作</text>
  <text x="88" y="180" fill="#0F172A" font-size="48" font-family="Arial, sans-serif" font-weight="800">一個 segment = 一個 subtask</text>
  <text x="88" y="228" fill="#64748B" font-size="26" font-family="Arial, sans-serif">灰 = 未開始｜藍 = 做緊｜黃 = 等緊｜紫 = 完成</text>

  <g transform="translate(200 360)">
    <circle cx="160" cy="160" r="104" fill="url(#bubble1)"/>
    <circle cx="160" cy="160" r="136" stroke="#D8DCE8" stroke-width="20" stroke-dasharray="44 26" transform="rotate(-90 160 160)"/>
    <text x="160" y="168" text-anchor="middle" fill="#4338CA" font-size="32" font-family="Arial, sans-serif" font-weight="800">未開始</text>
    <text x="160" y="340" text-anchor="middle" fill="#475569" font-size="28" font-family="Arial, sans-serif" font-weight="700">Stage 1 · #D8DCE8</text>
  </g>

  <g transform="translate(560 360)">
    <circle cx="160" cy="160" r="104" fill="url(#bubble2)"/>
    <circle cx="160" cy="160" r="136" stroke="#D8DCE8" stroke-width="20" stroke-dasharray="44 26" transform="rotate(-90 160 160)"/>
    <circle cx="160" cy="160" r="136" stroke="#60A5FA" stroke-width="20" stroke-linecap="round" stroke-dasharray="44 26" transform="rotate(-90 160 160)"/>
    <text x="160" y="168" text-anchor="middle" fill="#1D4ED8" font-size="32" font-family="Arial, sans-serif" font-weight="800">做緊</text>
    <text x="160" y="340" text-anchor="middle" fill="#475569" font-size="28" font-family="Arial, sans-serif" font-weight="700">Stage 2 · #60A5FA</text>
  </g>

  <g transform="translate(200 840)">
    <circle cx="160" cy="160" r="104" fill="url(#bubble3)"/>
    <circle cx="160" cy="160" r="136" stroke="#D8DCE8" stroke-width="20" stroke-dasharray="44 26" transform="rotate(-90 160 160)"/>
    <circle cx="160" cy="160" r="136" stroke="#F59E0B" stroke-width="20" stroke-linecap="round" stroke-dasharray="44 26" stroke-dashoffset="70" transform="rotate(-90 160 160)"/>
    <text x="160" y="168" text-anchor="middle" fill="#B45309" font-size="32" font-family="Arial, sans-serif" font-weight="800">等緊</text>
    <text x="160" y="340" text-anchor="middle" fill="#475569" font-size="28" font-family="Arial, sans-serif" font-weight="700">Stage 3 · #F59E0B</text>
  </g>

  <g transform="translate(560 840)">
    <circle cx="160" cy="160" r="104" fill="url(#bubble4)"/>
    <circle cx="160" cy="160" r="136" stroke="#8B5CF6" stroke-width="20" stroke-linecap="round" stroke-dasharray="44 26" transform="rotate(-90 160 160)"/>
    <text x="160" y="168" text-anchor="middle" fill="#6D28D9" font-size="32" font-family="Arial, sans-serif" font-weight="800">完成</text>
    <text x="160" y="340" text-anchor="middle" fill="#475569" font-size="28" font-family="Arial, sans-serif" font-weight="700">Stage 4 · #8B5CF6</text>
  </g>

  <text x="88" y="1380" fill="#0F172A" font-size="34" font-family="Arial, sans-serif" font-weight="800">建議規則</text>
  <text x="88" y="1440" fill="#475569" font-size="28" font-family="Arial, sans-serif">• Segment 數量 = subtask 數量</text>
  <text x="88" y="1494" fill="#475569" font-size="28" font-family="Arial, sans-serif">• 已完成嘅 segment 用實色</text>
  <text x="88" y="1548" fill="#475569" font-size="28" font-family="Arial, sans-serif">• 做緊 / 等緊分開用藍 / 黃橙</text>
  <text x="88" y="1602" fill="#475569" font-size="28" font-family="Arial, sans-serif">• 想再簡化，之後可以收窄成 3-stage</text>
</svg>
