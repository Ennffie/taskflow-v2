<svg width="1200" height="1500" viewBox="0 0 1200 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="600" y1="0" x2="600" y2="1500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF8FF"/>
      <stop offset="1" stop-color="#F1F8FF"/>
    </linearGradient>
    <linearGradient id="phoneBg" x1="390" y1="0" x2="390" y2="844" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFAFF"/>
      <stop offset="1" stop-color="#F6F9FF"/>
    </linearGradient>
    <radialGradient id="planet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(310 180) rotate(55) scale(240)">
      <stop stop-color="#F1E5FF"/>
      <stop offset="0.5" stop-color="#DDD0FE"/>
      <stop offset="1" stop-color="#C8B0FA"/>
    </radialGradient>
    <linearGradient id="orbit" x1="150" y1="90" x2="620" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0E9FF"/>
      <stop offset="1" stop-color="#DDD3FF"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="1500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#8B5CF6" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>

  <g transform="translate(210 120)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="780" height="1260" rx="70" fill="url(#phoneBg)"/>
    </g>
    <rect x="246" y="18" width="288" height="36" rx="18" fill="#111827" fill-opacity="0.94"/>

    <circle cx="80" cy="120" r="26" fill="#FFFFFF" fill-opacity="0.9"/>
    <path d="M 90 120 L 72 120 M 80 110 L 72 120 L 80 130" stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="110" fill="#0F172A" font-size="42" font-family="Arial, sans-serif" font-weight="800">一步步加</text>
    <text x="120" y="152" fill="#6B7280" font-size="20" font-family="Arial, sans-serif">收到 task 就先記低，未齊都可以慢慢補</text>

    <g filter="url(#shadow)">
      <rect x="34" y="196" width="712" height="278" rx="42" fill="#FFFFFF" fill-opacity="0.88"/>
    </g>
    <g transform="translate(390 282)">
      <ellipse cx="0" cy="0" rx="164" ry="110" stroke="url(#orbit)" stroke-width="7" stroke-dasharray="7 12"/>
      <ellipse cx="0" cy="0" rx="118" ry="166" stroke="url(#orbit)" stroke-width="5" stroke-dasharray="6 10" opacity="0.92"/>
      <circle cx="0" cy="0" r="112" fill="url(#planet)"/>
      <circle cx="-34" cy="-44" r="32" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="0" y="0" text-anchor="middle" fill="#5B21B6" font-size="26" font-family="Arial, sans-serif" font-weight="800">Benne UX Review</text>
      <text x="0" y="30" text-anchor="middle" fill="#6D28D9" font-size="16" font-family="Arial, sans-serif" font-weight="700">新 task draft</text>
      <circle cx="0" cy="-112" r="18" fill="#8B5CF6"/>
      <circle cx="134" cy="0" r="15" fill="#C4B5FD"/>
      <circle cx="0" cy="118" r="13" fill="#DDD6FE"/>
      <circle cx="-134" cy="0" r="16" fill="#E7D7FF"/>
    </g>

    <rect x="64" y="502" width="652" height="60" rx="30" fill="#F3E8FF"/>
    <rect x="72" y="510" width="118" height="44" rx="22" fill="#7C3AED"/>
    <text x="131" y="538" text-anchor="middle" fill="#FFFFFF" font-size="18" font-family="Arial, sans-serif" font-weight="700">1 / 5</text>
    <text x="218" y="540" fill="#6D28D9" font-size="18" font-family="Arial, sans-serif" font-weight="700">呢個 task 叫咩名？</text>

    <rect x="34" y="590" width="712" height="114" rx="32" fill="url(#field)"/>
    <text x="64" y="640" fill="#0F172A" font-size="28" font-family="Arial, sans-serif" font-weight="700">Benne UX review deck</text>
    <text x="64" y="680" fill="#94A3B8" font-size="18" font-family="Arial, sans-serif">例如：跟進 UX review feedback</text>

    <text x="50" y="770" fill="#0F172A" font-size="28" font-family="Arial, sans-serif" font-weight="800">常用 quick picks</text>
    <rect x="50" y="798" width="200" height="64" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="150" y="838" text-anchor="middle" fill="#475569" font-size="20" font-family="Arial, sans-serif" font-weight="700">我自己跟</text>
    <rect x="272" y="798" width="200" height="64" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="372" y="838" text-anchor="middle" fill="#475569" font-size="20" font-family="Arial, sans-serif" font-weight="700">今日要交</text>
    <rect x="494" y="798" width="200" height="64" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="594" y="838" text-anchor="middle" fill="#475569" font-size="20" font-family="Arial, sans-serif" font-weight="700">早一日提我</text>

    <rect x="50" y="922" width="700" height="136" rx="32" fill="#FFFFFF" fill-opacity="0.88"/>
    <text x="80" y="972" fill="#0F172A" font-size="24" font-family="Arial, sans-serif" font-weight="800">之後會問：</text>
    <text x="80" y="1012" fill="#6B7280" font-size="18" font-family="Arial, sans-serif">• 想交俾邊個跟</text>
    <text x="80" y="1044" fill="#6B7280" font-size="18" font-family="Arial, sans-serif">• 幾時前要搞掂（date / HHMM）</text>

    <rect x="50" y="1168" width="250" height="66" rx="24" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="175" y="1211" text-anchor="middle" fill="#475569" font-size="22" font-family="Arial, sans-serif" font-weight="700">返回</text>
    <rect x="324" y="1168" width="426" height="66" rx="24" fill="#111827"/>
    <text x="537" y="1211" text-anchor="middle" fill="#FFFFFF" font-size="22" font-family="Arial, sans-serif" font-weight="800">下一步</text>
  </g>
</svg>
